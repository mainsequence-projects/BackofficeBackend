api_version: "3.0.0"
name: backoffice
# Provider registration creates an absent backoffice namespace and gives the
# migration Job editor. A human Job manager grants the API workload data_writer
# and a human/Team owner afterwards; workloads never grant roles from this file.
scope:
  environments: [production]
resources:
  - key: backoffice_api
    kind: fastapi
    spec:
      source_path: api/app/main.py
      min_scale: 0
      max_scale: 5
      automatic_deployment: true
      revision_retention_count: 3
      automatic_redeployment:
        enabled: true
        tag_regex: null
      cors_allowed_origins:
        - https://*.site-dev.main-sequence.app
      public_ingress: []
      mcp_enabled: true
    access:
      branches:
        - repository: MetaTables
          policy: reader
  - key: extract-backoffice-document
    kind: job
    spec:
      name: Back Office document extraction
      execution_path: scripts/process_document.py
      cpu_request: "1"
      memory_request: "2"
      max_runtime_seconds: 1200
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
      env_vars:
        - name: BACKOFFICE_DOCUMENT_BUCKET
          value: backoffice-documents
    access:
      branches:
        - repository: MetaTables
          policy: reader
  - key: backoffice_helper
    kind: harness_agent
    acts_for_requester: true
    access:
      resources:
        - key: backoffice_api
          policy: viewer
    spec:
      source_path: api/tau/main.py
      mcp_applications:
        - resource: backoffice_api
      env_vars:
        - name: TAU_EXCLUDE_BASE_TOOLS
          value: "true"
        - name: TAU_EXCLUDE_MAINSEQUENCE_MCP
          value: "true"
      # The session principal must have access to this provider/model combination.
      llm_provider: openai-codex
      llm_model: gpt-5.6-luna
      llm_thinking: medium
      min_scale: 0
      max_scale: 5
      cpu_request: "0.25"
      memory_request: "0.5"
      spot: false
      automatic_deployment: true
      automatic_redeployment:
        enabled: true
        tag_regex: null
      revision_retention_count: 3
  - key: verify-backoffice-agent
    kind: job
    spec:
      name: Back Office agent contract verification
      execution_path: scripts/check_agent_contract.py
      cpu_request: "0.25"
      memory_request: "0.5"
      max_runtime_seconds: 120
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
  - key: migrate-backoffice
    kind: job
    spec:
      name: Back Office migrations
      execution_path: scripts/migrate_backoffice.py
      cpu_request: "1"
      memory_request: "2"
      max_runtime_seconds: 600
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          policy: reader
execution:
  steps:
    image:
      prepare_image: backoffice_api
    migrate:
      run_job: migrate-backoffice
      image_from: image
      needs: [image]
    worker_image:
      prepare_image: extract-backoffice-document
      needs: [migrate]
    deploy_api:
      deploy: backoffice_api
      image_from: image
      needs: [migrate, worker_image]
    agent_contract:
      run_job: verify-backoffice-agent
      image_from: image
      needs: [deploy_api]
    agent_image:
      prepare_image: backoffice_helper
      needs: [agent_contract]
    deploy_agent:
      deploy: backoffice_helper
      image_from: agent_image
      needs: [agent_image]
