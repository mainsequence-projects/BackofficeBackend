[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backofficebackend"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.110,<1",
  "mainsequence[mcp]==9.0.29",
  "mainsequence-metatable==0.1.49",
  "pydantic>=2.13.5,<3",
  "sqlalchemy>=2.1,<3",
  "uvicorn==0.52.4",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<1", "build>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"src.backoffice.migrations" = ["script.py.mako"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["build", "dist", ".venv", ".tox", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "src", "scripts"]
